services:
  - type: web
    name: e-commerce-backend
    env: python
    repo: https://github.com/Sudhir4500/ecommerce-1.git
    branch: version_3
    rootDir: backend/
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: e-commerce-db
          property: connectionString
